  <rect x="16" y="16" width="208" height="32" rx="4" fill="url(#sheen)" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Top highlight line -->
  <path d="M20 20h200" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>
  <!-- Bottom shadow line -->
  <path d="M20 44h200" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
  <!-- Text -->
  <text x="120" y="34" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#1e40af" letter-spacing="1">BUSTECH</text>
  <text x="120" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-weight="700" font-size="11" fill="#1e40af" letter-spacing="0.5">engineering</text>
