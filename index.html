<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>BusTech Engineering · Bus PDI Road Test</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <!-- Font & Icons (kept here for simplicity) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="top-row">
            <div class="brand">
    <img src="assets/logo.jpg"
         alt="BusTech Engineering Logo"
         class="company-logo">

    <div class="brand-text">
        <span class="app-name">PDI Road Test</span>
    </div>
</div>
            <div class="header-actions">
                <button onclick="scanQR()" title="Scan QR" aria-label="Scan QR code"><i class="fas fa-qrcode"></i></button>
                <button onclick="confirmReset()" title="Reset Inspection" aria-label="Reset all inspection data"><i class="fas fa-undo"></i></button>
                <button onclick="toggleDarkMode()" title="Theme" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        <div class="subtitle">
            <div class="subtitle-text">
                <i class="fas fa-clipboard-check"></i>
                Chassis Level-2 · Grouped Inspection
            </div>
            <div class="header-timer" id="headerTimer" title="2-Hour Countdown Timer">
                <i class="fas fa-stopwatch" id="timerIcon"></i>
                <span id="timerDisplay">02:00:00</span>
                <button type="button" class="btn-timer-toggle" id="timerControlBtn" onclick="toggleTimer()" aria-label="Pause timer">
                    <i class="fas fa-pause"></i>
                </button>
                <button type="button" class="btn-timer-reset" id="timerResetBtn" onclick="resetTimer()" aria-label="Reset timer">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- VEHICLE METADATA -->
    <section class="metadata-section" aria-label="Vehicle identification details">
        <div class="metadata-field">
            <label for="vinInput">Chassis / VIN #</label>
            <input type="text" id="vinInput" placeholder="Enter VIN/Chassis number" autocomplete="off" />
        </div>
        <div class="metadata-field">
            <label for="odometerInput">Odometer Reading</label>
            <input type="text" id="odometerInput" placeholder="Enter odometer reading" autocomplete="off" />
        </div>
        <div class="metadata-field">
            <label for="inspectorIdInput">Inspector ID</label>
            <input type="text" id="inspectorIdInput" placeholder="Enter inspector ID" autocomplete="off" />
        </div>
    </section>

    <!-- STATS -->
    <section class="stats-grid" id="statsGrid" aria-live="polite" role="status">
        <div class="stat-item">
            <div class="stat-number total" id="totalCount">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-item">
            <div class="stat-number passed" id="passedCount">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat-item">
            <div class="stat-number failed" id="failedCount">0</div>
            <div class="stat-label">Failed</div>
        </div>
        <div class="stat-item">
            <div class="stat-number pending" id="pendingCount">0</div>
            <div class="stat-label">Pending</div>
        </div>
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="search-wrap">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input type="text" id="searchInput" placeholder="Search assemblies..." autocomplete="off" aria-label="Search inspection items" />
        </div>
        <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="Filter inspection groups">
            <button type="button" class="tab active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="tab" data-filter="pass" aria-pressed="false">Pass</button>
            <button type="button" class="tab" data-filter="fail" aria-pressed="false">Fail</button>
            <button type="button" class="tab" data-filter="pending" aria-pressed="false">Pending</button>
        </div>
    </div>

    <!-- GLOBAL PROGRESS -->
    <section class="global-progress" aria-label="Inspection completion progress">
        <div class="global-progress-head">
            <span>Overall Progress</span>
            <span id="globalProgressText">0 / 0 (0%)</span>
        </div>
        <div class="global-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="globalProgressTrack">
            <div class="global-progress-fill" id="globalProgressFill"></div>
        </div>
    </section>

    <!-- GROUP LIST -->
    <div class="group-list" id="groupList"></div>

    <!-- SIGNATURE -->
    <section class="signature-section" aria-label="Inspector sign-off">
        <div class="signature-head">
            <h3>Inspector Final Sign-off</h3>
            <button type="button" class="btn-outline" id="clearSignatureBtn">Clear Signature</button>
        </div>
        <canvas id="signaturePad" width="800" height="240" aria-label="Inspector signature pad"></canvas>
    </section>

    <section id="printReport" class="print-report" hidden></section>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <button type="button" class="btn-outline" onclick="exportPDF()" aria-label="Generate PDF report"><i class="fas fa-file-pdf" aria-hidden="true"></i> Generate PDF Report</button>
        <button type="button" class="btn-outline" onclick="exportCSV()" aria-label="Export CSV"><i class="fas fa-file-excel" aria-hidden="true"></i> CSV</button>
        <button type="button" class="btn-primary" onclick="saveJSON()" aria-label="Save inspection data"><i class="fas fa-save" aria-hidden="true"></i> Save</button>
        <button type="button" class="btn-outline" onclick="document.getElementById('importJsonInput').click()" aria-label="Load saved JSON file">
            <i class="fas fa-upload" aria-hidden="true"></i> Load
        </button>
        <input type="file" id="importJsonInput" accept=".json" onchange="importJSON(event)" />
    </div>

    <!-- TOAST & MODAL -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
            <h2 id="modalTitle">Confirm Fail</h2>
            <div id="modalMessage">
                <p>Marking as <strong>FAIL</strong>. Please ensure you capture a photo as evidence.</p>
                <label for="failEvidence" class="photo-upload-label">Failure Evidence Photo <span style="color:var(--danger)">*</span></label>
                <input type="file" id="failEvidence" accept="image/*" capture="environment" required />
                <img id="failEvidencePreview" class="photo-preview-fail" src="" alt="Failure evidence preview" />
            </div>
            <div class="modal-actions">
                <button class="btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn-danger" id="modalConfirmBtn">Confirm Fail</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
</body>
</html>
